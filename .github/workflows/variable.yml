name: Artifact Demo

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Create File
        run: |
          mkdir output
          echo "Hello GitHub Actions" > output/result.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: output/

  deploy:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-files

      - name: Show Files
        run: ls -R

      - name: Read File
        run: cat result.txt


