name: Cache Demo

on:
  push:
    branches:
      - main

jobs:

  cache-demo:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Cache NPM
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}

      - name: Install Packages
        run: |
          npm --version


