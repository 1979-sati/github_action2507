name: Variables Demo

on:
  push:
    branches:
      - main

env:
  APP_NAME: Terraform-App
  ENVIRONMENT: Dev
  VERSION: 1.0

jobs:

  demo:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Show Variables
        run: |
          echo "Application : $APP_NAME"
          echo "Environment : $ENVIRONMENT"
          echo "Version : $VERSION"


