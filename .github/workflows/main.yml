name: Multiple Jobs Demo

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Started
        run: echo "Building Application..."

      - name: Show Files
        run: ls -la

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Testing
        run: echo "Running Tests..."

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: echo "Deploying Application..."


